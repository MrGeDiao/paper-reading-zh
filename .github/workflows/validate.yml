name: Validate rule package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m py_compile scripts/check_rules.py
      - run: python3 scripts/check_rules.py
      - run: python3 -m json.tool evals/scenarios.json > /dev/null
